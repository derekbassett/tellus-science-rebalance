[mod-setting-name]
tellus-science-rebalance-ingredient-multiplier=Ingredient cost multiplier
tellus-science-rebalance-time-multiplier=Crafting time multiplier

[mod-setting-description]
tellus-science-rebalance-ingredient-multiplier=How much to multiply each Tellus science pack recipe's ingredient amounts. Item amounts are rounded up to the nearest whole number; fluids may be fractional. Default: 2.
tellus-science-rebalance-time-multiplier=How much to multiply each Tellus science pack recipe's crafting time. Default: 2.
